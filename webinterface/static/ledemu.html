<!doctype html>
<html class="dark" lang="en">
<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" type="image/png" sizes="32x32" href="../static/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="../static/favicon-16x16.png">
    <link rel="mask-icon" href="../static/safari-pinned-tab.svg" color="#0ed3cf">
    <meta name="msapplication-TileColor" content="#da532c">
    <meta name="theme-color" content="#0ed3cf">

    <title>Piano LED Emulator (Zero-Latency)</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #000000;
            overflow-x: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        canvas {
            display: block;
        }
        #ledemu1 {
            width: 100%;
            height: 30px;
        }
        #ledemu2 {
            width: 100%;
            height: 50px;
        }
        #ledemu3 {
            width: 96vmin;
            height: 96vmin;
        }
    </style>
</head>

<body>

<canvas id="ledemu1"></canvas>
<canvas id="ledemu2"></canvas>
<canvas id="ledemu3"></canvas>

<script>
    // --- Pre-computed Gamma 2.2 Look-Up Table (Zero math in render loop) ---
    const GAMMA_LUT = new Uint8Array(256);
    for (let i = 0; i < 256; i++) {
        GAMMA_LUT[i] = Math.round(((i / 255) ** (1 / 2.2)) * 255);
    }

    let socket;
    let lastLedState = null;
    let hasNewFrame = false;
    let lastFrameTime = 0;
    const TARGET_FPS = 60;
    const FRAME_TIME = 1000 / TARGET_FPS;

    // Canvas 1: Direct LED Strip bar
    const ledemu1 = document.getElementById("ledemu1");
    const ctx1 = ledemu1.getContext('2d', { alpha: false });

    // Canvas 2: Linear Light Glow / Bloom
    const ledemu2 = document.getElementById("ledemu2");
    const ctx2 = ledemu2.getContext('2d');

    // Canvas 3: Circular Ring Emulator
    const ledemu3 = document.getElementById("ledemu3");
    const ctx3 = ledemu3.getContext('2d');

    // Pixel Buffer cache for Canvas 1 (zero-allocation direct blit)
    let barImageData = null;
    let barPixels32 = null;

    function resizeCanvases() {
        const dpr = window.devicePixelRatio || 1;
        const w = window.innerWidth;

        ledemu1.width = w;
        ledemu1.height = 30;
        ctx1.fillStyle = "#000000";
        ctx1.fillRect(0, 0, w, 30);
        barImageData = ctx1.createImageData(w, 10);
        barPixels32 = new Uint32Array(barImageData.data.buffer);

        ledemu2.width = w;
        ledemu2.height = 50;

        const dim = Math.min(window.innerWidth, window.innerHeight * 0.9);
        ledemu3.width = dim;
        ledemu3.height = dim;
    }

    window.addEventListener('resize', resizeCanvases);
    resizeCanvases();

    function renderFrame(now) {
        if (now - lastFrameTime >= FRAME_TIME) {
            if (hasNewFrame && lastLedState) {
                renderBarFast(ctx1, lastLedState);
                renderLightsFast(ctx2, lastLedState);
                renderRingFast(ctx3, lastLedState);
                hasNewFrame = false;
            }
            lastFrameTime = now;
        }
        requestAnimationFrame(renderFrame);
    }

    function establish_socket_connection() {
        socket = new WebSocket('ws://' + window.location.hostname + ':8765/ledemu');

        socket.addEventListener('message', function (event) {
            try {
                const msg = JSON.parse(event.data);
                if (msg && msg.leds) {
                    lastLedState = msg.leds;
                    hasNewFrame = true;
                }
            } catch (e) {}
        });

        socket.addEventListener('close', function () {
            setTimeout(establish_socket_connection, 3000);
        });

        socket.addEventListener('error', function () {
            try { socket.close(); } catch(e) {}
        });
    }

    establish_socket_connection();
    requestAnimationFrame(renderFrame);

    window.addEventListener('beforeunload', function() {
        if (socket && socket.readyState === WebSocket.OPEN) {
            socket.close();
        }
    });

    // 1. Ultra-fast bar rendering: Direct 32-bit pixel memory blit (1 draw call, 0 allocations)
    function renderBarFast(ctx, leds) {
        const numLeds = leds.length;
        if (!numLeds || !barPixels32) return;

        const w = ctx.canvas.width;
        const h = 10;
        const ledWidth = w / numLeds;

        // Populate the single 1D row in the 32-bit pixel buffer
        for (let i = 0; i < numLeds; i++) {
            const raw = leds[i];
            const r = GAMMA_LUT[(raw >> 16) & 0xFF];
            const g = GAMMA_LUT[(raw >> 8) & 0xFF];
            const b = GAMMA_LUT[raw & 0xFF];

            // Little-endian packed RGBA (0xAABBGGRR)
            const pixelVal = (0xFF << 24) | (b << 16) | (g << 8) | r;
            const startX = Math.floor(i * ledWidth);
            const endX = Math.floor((i + 1) * ledWidth);

            for (let y = 0; y < h; y++) {
                const rowOffset = y * w;
                for (let x = startX; x < endX; x++) {
                    barPixels32[rowOffset + x] = pixelVal;
                }
            }
        }

        ctx.putImageData(barImageData, 0, 10);
    }

    // 2. Optimized lights rendering: Skip dark LEDs, reuse radial gradient
    function renderLightsFast(ctx, leds) {
        const w = ctx.canvas.width;
        const h = ctx.canvas.height;
        ctx.fillStyle = "#000000";
        ctx.fillRect(0, 0, w, h);

        const numLeds = leds.length;
        if (!numLeds) return;
        const ledWidth = w / numLeds;
        const bloom = Math.max(8, ledWidth * 3.5);

        ctx.globalCompositeOperation = "lighten";

        for (let i = 0; i < numLeds; i++) {
            const raw = leds[i];
            if ((raw & 0xFFFFFF) === 0) continue; // Fast skip dark LEDs

            const r = GAMMA_LUT[(raw >> 16) & 0xFF];
            const g = GAMMA_LUT[(raw >> 8) & 0xFF];
            const b = GAMMA_LUT[raw & 0xFF];

            const cx = i * ledWidth + ledWidth * 0.5;
            const cy = 25;

            const grad = ctx.createRadialGradient(cx, cy, 1, cx, cy, bloom);
            grad.addColorStop(0, `rgb(${r},${g},${b})`);
            grad.addColorStop(0.35, `rgba(${r},${g},${b},0.45)`);
            grad.addColorStop(1, 'rgba(0,0,0,0)');

            ctx.fillStyle = grad;
            ctx.fillRect(cx - bloom, cy - bloom, bloom * 2, bloom * 2);
        }

        ctx.globalCompositeOperation = "source-over";
    }

    // 3. Optimized ring rendering: Skip dark LEDs, zero-allocation trigonometry
    function renderRingFast(ctx, leds) {
        const dim = ctx.canvas.width;
        ctx.fillStyle = "#000000";
        ctx.fillRect(0, 0, dim, dim);

        const numLeds = leds.length;
        if (!numLeds) return;

        const radius = dim * 0.40;
        const centerX = dim * 0.5;
        const centerY = dim * 0.5;
        const bloom = dim * 0.065;

        ctx.globalCompositeOperation = "screen";

        for (let i = 0; i < numLeds; i++) {
            const raw = leds[i];
            if ((raw & 0xFFFFFF) === 0) continue; // Fast skip dark LEDs

            const r = GAMMA_LUT[(raw >> 16) & 0xFF];
            const g = GAMMA_LUT[(raw >> 8) & 0xFF];
            const b = GAMMA_LUT[raw & 0xFF];

            const pos = i / numLeds;
            const posrad = (pos * 0.9 + 0.05) * 2 * Math.PI + Math.PI * 0.5;
            const x = Math.cos(posrad) * radius + centerX;
            const y = Math.sin(posrad) * radius + centerY;

            const grad = ctx.createRadialGradient(x, y, 0.5, x, y, bloom);
            grad.addColorStop(0, `rgb(${r},${g},${b})`);
            grad.addColorStop(0.25, `rgba(${r},${g},${b},0.6)`);
            grad.addColorStop(1, 'rgba(0,0,0,0)');

            ctx.fillStyle = grad;
            ctx.fillRect(x - bloom, y - bloom, bloom * 2, bloom * 2);
        }

        ctx.globalCompositeOperation = "source-over";
    }
</script>

</body>
</html>
