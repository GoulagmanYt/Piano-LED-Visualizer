name: Tests

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: System packages (ALSA headers for python-rtmidi, compiler for the Pi-only wheels)
        run: sudo apt-get update && sudo apt-get install -y build-essential libasound2-dev

      - name: Install dependencies
        run: pip install -r requirements-dev.txt ruff

      - name: Lint (gate - syntax errors and undefined names)
        run: ruff check --select E9,F63,F7,F82 lib webinterface visualizer.py tests tools

      - name: Lint (informational - unused code, bare except)
        run: ruff check --select F401,F841,E722 --exit-zero --statistics lib webinterface visualizer.py

      - name: Tests (hardware LCD test is skipped automatically off a Raspberry Pi)
        run: python -m pytest -q
