name: Build Piano LED Visualizer Image

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-image:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    env:
      BASE_IMAGE: 2026-10-06-raspios-bookworm-armhf-lite.img
      BASE_URL: https://downloads.raspberrypi.com/raspios_oldstable_lite_armhf/images/raspios_oldstable_lite_armhf-2026-10-06
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up ARM emulation and image tools
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-user-static binfmt-support parted e2fsprogs xz-utils
          sudo update-binfmts --enable qemu-arm

      - name: Download and verify Raspberry Pi OS Lite
        run: |
          curl --fail --location --retry 3 -O "$BASE_URL/$BASE_IMAGE.xz"
          curl --fail --location --retry 3 -o base.sha256 "$BASE_URL/$BASE_IMAGE.xz.sha256"
          sha256sum --check base.sha256
          xz --decompress "$BASE_IMAGE.xz"
          mv "$BASE_IMAGE" raspi.img

      - name: Expand and mount image
        run: |
          truncate -s +4G raspi.img
          LOOPDEV=$(sudo losetup --find --show --partscan raspi.img)
          echo "LOOPDEV=$LOOPDEV" >> "$GITHUB_ENV"
          sudo parted --script "$LOOPDEV" resizepart 2 100%
          sudo partprobe "$LOOPDEV"
          sudo udevadm settle
          status=0
          sudo e2fsck -fy "${LOOPDEV}p2" || status=$?
          (( status <= 1 ))
          sudo resize2fs "${LOOPDEV}p2"
          mkdir rootfs
          sudo mount "${LOOPDEV}p2" rootfs
          sudo mkdir -p rootfs/boot/firmware
          sudo mount "${LOOPDEV}p1" rootfs/boot/firmware
          sudo mount -t proc proc rootfs/proc
          sudo mount -t sysfs sysfs rootfs/sys
          sudo mount --rbind /dev rootfs/dev
          sudo mount --make-rslave rootfs/dev
          sudo cp /usr/bin/qemu-arm-static rootfs/usr/bin/
          # Use runner DNS only during build, preserving the image's resolver.
          sudo cp -a rootfs/etc/resolv.conf resolv.conf.original
          sudo rm rootfs/etc/resolv.conf
          sudo cp -L /etc/resolv.conf rootfs/etc/resolv.conf
          printf '#!/bin/sh\nexit 101\n' | sudo tee rootfs/usr/sbin/policy-rc.d >/dev/null
          sudo chmod 0755 rootfs/usr/sbin/policy-rc.d

      - name: Install the exact checked-out revision
        run: |
          APP=rootfs/home/Piano-LED-Visualizer
          # Clone tracked files only, never credentials, local settings or caches.
          sudo git clone --no-local "$GITHUB_WORKSPACE" "$APP"
          sudo git -C "$APP" checkout -B master "$GITHUB_SHA"
          sudo git -C "$APP" remote set-url origin https://github.com/GoulagmanYt/Piano-LED-Visualizer.git
          sudo git -C "$APP" config pull.ff only
          sudo git -C "$APP" config core.filemode false
          sudo chroot rootfs /bin/bash /home/Piano-LED-Visualizer/scripts/image-install.sh

      - name: Validate installed image
        run: |
          sudo chroot rootfs /home/Piano-LED-Visualizer/.venv/bin/python -m pip check
          sudo chroot rootfs /home/Piano-LED-Visualizer/.venv/bin/python -c \
            'import flask, waitress, websockets, mido, rtmidi, numpy, PIL, spidev; from importlib.metadata import version; print({p: version(p) for p in ("RPi.GPIO", "rpi-ws281x")})'
          sudo chroot rootfs systemctl is-enabled visualizer.service rtpmidid.service plv-lowlatency.service ssh.service plv-first-boot.service
          sudo chroot rootfs systemd-analyze verify visualizer.service rtpmidid.service plv-lowlatency.service plv-first-boot.service
          sudo test -s rootfs/boot/firmware/config.txt
          sudo test -x rootfs/home/Piano-LED-Visualizer/.venv/bin/python
          APP="$GITHUB_WORKSPACE/rootfs/home/Piano-LED-Visualizer"
          test "$(sudo git -c safe.directory="$APP" -C "$APP" rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Sanitize image
        run: |
          sudo chroot rootfs apt-get clean
          sudo rm -rf rootfs/var/lib/apt/lists/* rootfs/tmp/* rootfs/var/tmp/*
          sudo find rootfs/var/log -type f -exec truncate -s 0 {} +
          sudo rm -f rootfs/etc/ssh/ssh_host_* rootfs/var/lib/systemd/random-seed
          sudo truncate -s 0 rootfs/etc/machine-id
          sudo rm -f rootfs/var/lib/dbus/machine-id
          sudo ln -s /etc/machine-id rootfs/var/lib/dbus/machine-id
          sudo find rootfs/etc/NetworkManager/system-connections -type f -delete
          sudo rm -f rootfs/usr/bin/qemu-arm-static rootfs/usr/sbin/policy-rc.d
          sudo rm rootfs/etc/resolv.conf
          sudo cp -a resolv.conf.original rootfs/etc/resolv.conf
          sudo rm resolv.conf.original
          sync

      - name: Unmount image (also on failure)
        if: always()
        run: |
          if mountpoint -q rootfs; then
            sudo umount --recursive rootfs
          fi
          if [ -n "${LOOPDEV:-}" ]; then
            sudo losetup --detach "$LOOPDEV"
          fi

      - name: Shrink and compress image
        run: |
          curl --fail --location --retry 3 -o pishrink.sh \
            https://raw.githubusercontent.com/Drewsif/PiShrink/5f358d03eed4b7334657ee93867826a2b42f112a/pishrink.sh
          sudo bash pishrink.sh -z raspi.img plv.img
          test -s plv.img.gz
          gzip --test plv.img.gz
          sha256sum plv.img.gz > plv.img.gz.sha256

      - name: Upload flashable image and checksum
        uses: actions/upload-artifact@v4
        with:
          name: plv-bookworm-armhf-${{ github.sha }}
          path: |
            plv.img.gz
            plv.img.gz.sha256
          if-no-files-found: error
          compression-level: 0
